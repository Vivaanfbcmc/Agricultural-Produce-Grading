<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VEGEGRADE — AI Vegetable Grading & Marketplace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg1: #0a0e17;
            --bg2: #0f172a;
            --card: #ffffff;
            --muted: #94a3b8;
            --accent: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --accent-reverse: linear-gradient(135deg, #059669 0%, #10b981 100%);
            --primary: #059669;
            --secondary: #0ea5e9;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --header-height: 120px;
            --hero-offset: 35vw;
            --fade-extra: 8vw;
            --card-shadow: 0 20px 60px rgba(2, 6, 23, 0.5);
            --transition-smooth: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(180deg, #07101a 0%, #0b1220 50%, #0f172a 100%);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            position: relative;
        }

        /* Background Decorative Elements */
        .background-elements {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .background-elements::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(16, 185, 129, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(14, 165, 233, 0.1) 0%, transparent 50%);
        }

        /* Animated Gradient Orbs */
        .gradient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.15;
            animation: float 20s infinite linear;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: linear-gradient(45deg, #10b981, #0ea5e9);
            top: -200px;
            right: -200px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 300px;
            height: 300px;
            background: linear-gradient(45deg, #8b5cf6, #ec4899);
            bottom: -150px;
            left: -150px;
            animation-delay: -10s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) rotate(0deg);
            }
            25% {
                transform: translate(30px, -30px) rotate(90deg);
            }
            50% {
                transform: translate(0, -60px) rotate(180deg);
            }
            75% {
                transform: translate(-30px, -30px) rotate(270deg);
            }
        }

        /* Site Header */
        .site-header {
            position: relative;
            z-index: 20;
            padding: 24px 40px;
            background: rgba(7, 16, 26, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header-inner {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-placeholder {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 800;
            font-size: 20px;
            box-shadow: 0 8px 32px rgba(16, 185, 129, 0.3);
            transition: var(--transition-smooth);
        }

        .brand:hover .logo-placeholder {
            transform: rotate(15deg) scale(1.05);
        }

        .brand-content {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .brand .title {
            font-size: 36px;
            background: linear-gradient(90deg, #10b981, #0ea5e9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 900;
            letter-spacing: -0.5px;
            position: relative;
            line-height: 1;
        }

        .brand .title::after {
            content: '';
            display: block;
            width: 100px;
            height: 6px;
            margin-top: 8px;
            border-radius: 6px;
            background: linear-gradient(90deg, #10b981, #0ea5e9);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3);
            transform-origin: left;
            transition: transform 0.3s ease;
        }

        .brand:hover .title::after {
            transform: scaleX(1.2);
        }

        .tagline {
            color: var(--text-secondary);
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        /* Navigation */
        .nav-links {
            display: flex;
            gap: 32px;
            align-items: center;
        }

        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            padding: 8px 16px;
            border-radius: 10px;
            transition: var(--transition-smooth);
            position: relative;
        }

        .nav-link::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #10b981, #0ea5e9);
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }

        .nav-link:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-link:hover::before {
            width: 80%;
        }

        .nav-link.active {
            color: #10b981;
            background: rgba(16, 185, 129, 0.1);
        }

        /* Main Page Layout */
        .page {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
            display: grid;
            grid-template-columns: 1fr 500px;
            gap: 60px;
            align-items: center;
            min-height: calc(100vh - var(--header-height));
            position: relative;
            z-index: 10;
        }

        /* Card Styles */
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: var(--card-shadow);
            overflow: hidden;
            position: relative;
            z-index: 20;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: var(--transition-smooth);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 80px rgba(2, 6, 23, 0.6);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: var(--accent);
            border-radius: 24px 24px 0 0;
        }

        .card-header {
            padding: 24px 32px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(5, 150, 105, 0.05);
        }

        .tabs {
            display: flex;
            gap: 12px;
            background: rgba(255, 255, 255, 0.03);
            padding: 6px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .tab {
            flex: 1;
            padding: 14px 20px;
            border-radius: 10px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            transition: var(--transition-smooth);
            text-align: center;
        }

        .tab:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        .tab.active {
            background: var(--accent);
            color: white;
            box-shadow: 0 8px 32px rgba(5, 150, 105, 0.2);
            transform: scale(1.02);
        }

        .card-body {
            padding: 32px;
        }

        .form {
            display: none;
            animation: fadeInUp 0.4s ease both;
        }

        .form.active {
            display: block;
        }

        .form h2 {
            font-size: 24px;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #10b981, #0ea5e9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-secondary);
            margin-bottom: 24px;
            font-size: 15px;
            line-height: 1.6;
        }

        label {
            display: block;
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 20px;
            font-weight: 500;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"],
        input[type="tel"],
        select {
            width: 100%;
            padding: 16px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            font-size: 15px;
            outline: none;
            transition: var(--transition-smooth);
        }

        input::placeholder,
        select::placeholder {
            color: var(--muted);
        }

        input:focus,
        select:focus {
            border-color: rgba(16, 185, 129, 0.5);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }

        .row {
            display: flex;
            gap: 16px;
        }

        .col {
            flex: 1;
        }

        .btn {
            display: inline-block;
            padding: 18px 24px;
            border-radius: 12px;
            border: none;
            background: var(--accent);
            color: white;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 24px;
            box-shadow: 0 12px 40px rgba(5, 150, 105, 0.2);
            transition: var(--transition-smooth);
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s ease;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 50px rgba(5, 150, 105, 0.3);
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:active {
            transform: translateY(-1px);
        }

        .btn-primary {
            background: var(--accent);
        }

        /* Hero Section with Carousel */
        .hero {
            position: relative;
            height: 80vh;
            min-height: 600px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 0;
            overflow: hidden;
        }

        /* Carousel Container */
        .carousel-container {
            position: fixed;
            top: 0;
            right: 0;
            width: 50vw;
            height: 100vh;
            z-index: 5;
            overflow: hidden;
            pointer-events: none;
        }

        /* Carousel Slides */
        .carousel-slides {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .carousel-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: opacity 1.5s ease-in-out;
            transform-origin: center;
        }

        .carousel-slide.active {
            opacity: 1;
            animation: zoomIn 20s ease-in-out infinite;
        }

        @keyframes zoomIn {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        /* Left Fade Overlay - Strong black gradient */
        .hero-fade {
            position: fixed;
            top: 0;
            left: 0;
            width: 50vw;
            height: 100vh;
            pointer-events: none;
            z-index: 6;
            background: linear-gradient(
                90deg,
                var(--bg1) 0%,
                rgba(7, 16, 26, 0.95) 10%,
                rgba(7, 16, 26, 0.85) 20%,
                rgba(7, 16, 26, 0.7) 30%,
                rgba(7, 16, 26, 0.5) 40%,
                rgba(7, 16, 26, 0.3) 50%,
                rgba(7, 16, 26, 0.15) 60%,
                rgba(7, 16, 26, 0.05) 70%,
                transparent 100%
            );
        }

        /* Carousel Navigation */
        .carousel-nav {
            position: fixed;
            bottom: 40px;
            right: 50%;
            transform: translateX(50%);
            display: flex;
            gap: 12px;
            z-index: 10;
        }

        .carousel-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: var(--transition-smooth);
            position: relative;
            overflow: hidden;
        }

        .carousel-dot::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #10b981, #0ea5e9);
            transition: left 0.3s ease;
        }

        .carousel-dot.active {
            background: transparent;
        }

        .carousel-dot.active::before {
            left: 0;
        }

        .carousel-dot:hover {
            transform: scale(1.3);
        }

        .carousel-dot.active {
            transform: scale(1.3);
        }

        /* Carousel Controls */
        .carousel-controls {
            position: fixed;
            top: 50%;
            right: 25vw;
            transform: translate(50%, -50%);
            display: flex;
            gap: 20px;
            z-index: 10;
        }

        .carousel-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-smooth);
        }

        .carousel-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        /* Progress Bar */
        .carousel-progress {
            position: fixed;
            bottom: 20px;
            right: 25%;
            width: 50%;
            max-width: 400px;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            z-index: 10;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #0ea5e9);
            width: 0%;
            transition: width 0.1s linear;
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Form Error Styles */
        .form-error {
            color: #f87171;
            font-size: 14px;
            margin-top: 8px;
            padding: 8px 12px;
            background: rgba(248, 113, 113, 0.1);
            border-radius: 6px;
            border-left: 3px solid #f87171;
        }

        /* Responsive Design */
        @media (max-width: 1200px) {
            .page {
                grid-template-columns: 1fr 450px;
                gap: 40px;
            }
            
            .carousel-container {
                width: 45vw;
            }
            
            .hero-fade {
                width: 55vw;
            }
        }

        @media (max-width: 980px) {
            .page {
                grid-template-columns: 1fr;
                padding: 20px;
                gap: 40px;
            }
            
            .hero {
                order: 2;
                height: 400px;
                min-height: auto;
                justify-content: center;
                padding-right: 0;
            }
            
            .carousel-container {
                position: relative;
                width: 100%;
                height: 400px;
                border-radius: 20px;
                overflow: hidden;
            }
            
            .hero-fade {
                display: none;
            }
            
            .carousel-nav,
            .carousel-controls,
            .carousel-progress {
                position: absolute;
                right: 20px;
            }
            
            .carousel-nav {
                bottom: 20px;
                right: 50%;
                transform: translateX(50%);
            }
            
            .carousel-controls {
                top: 50%;
                right: 20px;
                transform: translateY(-50%);
            }
            
            .carousel-progress {
                bottom: 10px;
                right: 50%;
                transform: translateX(50%);
                width: 80%;
            }
            
            .header-inner {
                flex-direction: column;
                gap: 20px;
                text-align: center;
            }
            
            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
            }
        }

        @media (max-width: 768px) {
            .page {
                padding: 16px;
            }
            
            .card-header {
                padding: 20px;
            }
            
            .card-body {
                padding: 24px;
            }
            
            .brand .title {
                font-size: 28px;
            }
            
            .logo-placeholder {
                width: 50px;
                height: 50px;
                font-size: 18px;
            }
            
            .row {
                flex-direction: column;
                gap: 0;
            }
            
            .carousel-container {
                height: 300px;
            }
        }

        @media (max-width: 480px) {
            .site-header {
                padding: 16px;
            }
            
            .brand .title {
                font-size: 24px;
            }
            
            .tagline {
                font-size: 14px;
            }
            
            .nav-links {
                gap: 16px;
            }
            
            .nav-link {
                padding: 6px 12px;
                font-size: 14px;
            }
            
            .tabs {
                flex-direction: column;
            }
            
            .tab {
                padding: 12px;
            }
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #10b981, #0ea5e9);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #0ea5e9, #10b981);
        }
    </style>
</head>

<body>
    <!-- Background Elements -->
    <div class="background-elements">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
    </div>

    <!-- Site Header -->
    <header class="site-header">
        <div class="header-inner">
            <div class="brand">
                <div class="logo-placeholder" aria-hidden="true">VG</div>
                <div class="brand-content">
                    <h1 class="title">VEGEGRADE</h1>
                    <p class="tagline">AI-Powered Vegetable Quality Assessment & Marketplace</p>
                </div>
            </div>
            <nav class="nav-links">
                <a href="#" class="nav-link active">Home</a>
                <a href="#" class="nav-link">Features</a>
                <a href="#" class="nav-link">API</a>
                <a href="#" class="nav-link">Contact</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="page">
        <!-- Left Card -->
        <section class="card">
            <div class="card-header">
                <div class="tabs" role="tablist">
                    <button class="tab active" id="tab-signin">Sign In</button>
                    <button class="tab" id="tab-signup">Sign Up</button>
                </div>
            </div>

            <div class="card-body">
                <!-- SIGN IN FORM -->
                <form id="signin-form" class="form active">
                    <h2>Welcome Back</h2>
                    <p class="subtitle">Sign in to access your dashboard</p>

                    <label for="signin_phone">Phone Number</label>
                    <input type="tel" id="signin_phone" placeholder="Enter phone number" pattern="^[6-9][0-9]{9}$" maxlength="10" inputmode="numeric" />

                    <label for="signin_password">Password</label>
                    <input type="password" id="signin_password" placeholder="Enter password" minlength="7" />
                    <div id="signinError" class="form-error" aria-live="polite"></div>

                    <button class="btn" type="button" onclick="handleSignIn()">Sign In</button>
                </form>

                <!-- SIGN UP FORM -->
                <form id="signup-form" class="form">
                    <h2>Create Account</h2>
                    <p class="subtitle">Register and start selling</p>

                    <div class="row">
                        <div class="col">
                            <label for="fname">First Name</label>
                            <input type="text" id="fname" />
                        </div>
                        <div class="col">
                            <label for="lname">Last Name</label>
                            <input type="text" id="lname" />
                        </div>
                    </div>

                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" pattern="^[6-9][0-9]{9}$" maxlength="10" inputmode="numeric" />

                    <label for="email">Email (optional)</label>
                    <input type="email" id="email" placeholder="name@example.com (optional)" />

                    <div class="row">
                        <div class="col">
                            <label for="password">Password</label>
                            <input type="password" id="password" minlength="7" />
                        </div>
                        <div class="col">
                            <label for="confirm_password">Confirm</label>
                            <input type="password" id="confirm_password" minlength="7" />
                        </div>
                    </div>
                    <div id="signupError" class="form-error" aria-live="polite"></div>
                    <div style="margin-top:8px;">
                        <label><input type="checkbox" id="show_passwords"> Show passwords</label>
                    </div>

                    <div class="row">
                        <div class="col">
                            <label for="state">State</label>
                            <select id="state"><option value="">-- Select State --</option></select>
                        </div>
                        <div class="col">
                            <label for="district">District</label>
                            <select id="district"><option value="">-- Select District --</option></select>
                        </div>
                    </div>

                    <button class="btn btn-primary" type="button" onclick="handleSignUp()">Create account</button>
                </form>
            </div>
        </section>

        <!-- Right Hero with Carousel -->
        <section class="hero">
            <div class="carousel-container">
                <div class="carousel-slides">
                    <div class="carousel-slide" style="background-image: url('../images/farmer.jpg');"></div>
                    <div class="carousel-slide" style="background-image: url('../images//vegetables.webp');"></div>
                    <div class="carousel-slide" style="background-image: url('https://images.unsplash.com/photo-1579113800032-c38bd7635818?auto=format&fit=crop&w=1600')"></div>

<script src="Cities.js" defer></script>
<script src="script.js" defer></script>
<script>
    // Carousel Functionality
    let currentSlide = 0;
    let slideInterval;
    let progressInterval;
    const slideDuration = 5000; // 5 seconds per slide

    // Initialize carousel when DOM is loaded
    document.addEventListener('DOMContentLoaded', function() {
        console.log('DOM loaded, initializing carousel...');
        initCarousel();
        setupTabSwitching();
        setupPasswordToggle();
    });

    function initCarousel() {
        const slides = document.querySelectorAll('.carousel-slide');
        const dots = document.querySelectorAll('.carousel-dot');
        const prevBtn = document.querySelector('.prev-btn');
        const nextBtn = document.querySelector('.next-btn');
        const progressBar = document.querySelector('.progress-bar');
        
        if (slides.length === 0) {
            console.warn('No carousel slides found!');
            return;
        }
        
        console.log(`Found ${slides.length} carousel slides`);
        
        // Preload images for better transitions
        preloadImages(slides);
        
        // Force show first slide immediately
        slides[0].classList.add('active');
        slides[0].style.opacity = '1';
        dots[0].classList.add('active');
        
        // Start auto slide
        setTimeout(() => {
            startAutoSlide();
            startProgressBar();
        }, 1000);
        
        // Event Listeners
        if (prevBtn) {
            prevBtn.addEventListener('click', () => {
                resetAutoSlide();
                prevSlide();
            });
        }
        
        if (nextBtn) {
            nextBtn.addEventListener('click', () => {
                resetAutoSlide();
                nextSlide();
            });
        }
        
        dots.forEach((dot, index) => {
            dot.addEventListener('click', () => {
                resetAutoSlide();
                goToSlide(index);
            });
        });
        
        console.log('Carousel initialized successfully');
    }

    function preloadImages(slides) {
        slides.forEach((slide, index) => {
            const img = new Image();
            img.onload = function() {
                console.log(`Slide ${index + 1} image loaded`);
            };
            img.onerror = function() {
                console.warn(`Slide ${index + 1} image failed to load`);
            };
            // Extract URL from background-image style
            const bgImage = slide.style.backgroundImage;
            if (bgImage && bgImage !== 'none') {
                const url = bgImage.slice(5, -2); // Remove 'url("...")'
                img.src = url;
            }
        });
    }

    function updateSlide(index) {
        const slides = document.querySelectorAll('.carousel-slide');
        const dots = document.querySelectorAll('.carousel-dot');
        
        if (slides.length === 0) return;
        
        // Validate index
        if (index < 0) index = slides.length - 1;
        if (index >= slides.length) index = 0;
        
        // Remove active class from all slides and dots
        slides.forEach(slide => {
            slide.classList.remove('active');
            slide.style.opacity = '0';
        });
        dots.forEach(dot => dot.classList.remove('active'));
        
        // Add active class to current slide and dot
        slides[index].classList.add('active');
        slides[index].style.opacity = '1';
        if (dots[index]) {
            dots[index].classList.add('active');
        }
        
        currentSlide = index;
        
        // Reset progress bar
        const progressBar = document.querySelector('.progress-bar');
        if (progressBar) {
            progressBar.style.width = '0%';
            startProgressBar();
        }
        
        console.log(`Switched to slide ${index + 1}`);
    }

    function nextSlide() {
        const slides = document.querySelectorAll('.carousel-slide');
        if (slides.length === 0) return;
        
        let nextIndex = (currentSlide + 1) % slides.length;
        updateSlide(nextIndex);
    }

    function prevSlide() {
        const slides = document.querySelectorAll('.carousel-slide');
        if (slides.length === 0) return;
        
        let prevIndex = (currentSlide - 1 + slides.length) % slides.length;
        updateSlide(prevIndex);
    }

    function goToSlide(index) {
        const slides = document.querySelectorAll('.carousel-slide');
        if (index >= 0 && index < slides.length) {
            updateSlide(index);
        }
    }

    function startAutoSlide() {
        clearInterval(slideInterval);
        slideInterval = setInterval(nextSlide, slideDuration);
        console.log('Auto slide started');
    }

    function resetAutoSlide() {
        clearInterval(slideInterval);
        clearInterval(progressInterval);
        startAutoSlide();
    }

    function startProgressBar() {
        clearInterval(progressInterval);
        let width = 0;
        const increment = 100 / (slideDuration / 100);
        
        progressInterval = setInterval(() => {
            if (width >= 100) {
                clearInterval(progressInterval);
            } else {
                width += increment;
                const progressBar = document.querySelector('.progress-bar');
                if (progressBar) {
                    progressBar.style.width = width + '%';
                }
            }
        }, 100);
    }

    // Tab Switching
    function setupTabSwitching() {
        const tabSignIn = document.getElementById('tab-signin');
        const tabSignUp = document.getElementById('tab-signup');
        const signinForm = document.getElementById('signin-form');
        const signupForm = document.getElementById('signup-form');

        if (tabSignIn && tabSignUp) {
            tabSignIn.addEventListener('click', () => {
                signinForm.classList.add('active');
                signupForm.classList.remove('active');
                tabSignIn.classList.add('active');
                tabSignUp.classList.remove('active');
            });
            
            tabSignUp.addEventListener('click', () => {
                signupForm.classList.add('active');
                signinForm.classList.remove('active');
                tabSignUp.classList.add('active');
                tabSignIn.classList.remove('active');
            });
            
            console.log('Tab switching initialized');
        }
    }

    // Show/Hide Passwords
    function setupPasswordToggle() {
        const showPasswordsCheckbox = document.getElementById('show_passwords');
        if (showPasswordsCheckbox) {
            showPasswordsCheckbox.addEventListener('change', function() {
                const passwordFields = document.querySelectorAll('input[type="password"]');
                passwordFields.forEach(field => {
                    field.type = this.checked ? 'text' : 'password';
                });
            });
            console.log('Password toggle initialized');
        }
    }

    // Form Validation Functions (optional - can be removed if handled in script.js)
    function showError(elementId, message) {
        const errorElement = document.getElementById(elementId);
        if (errorElement) {
            errorElement.textContent = message;
            errorElement.style.display = 'block';
        }
    }

    function clearError(elementId) {
        const errorElement = document.getElementById(elementId);
        if (errorElement) {
            errorElement.textContent = '';
            errorElement.style.display = 'none';
        }
    }

    function validateSignIn() {
        const phone = document.getElementById('signin_phone')?.value;
        const password = document.getElementById('signin_password')?.value;
        
        clearError('signinError');
        
        if (!phone || !/^[6-9][0-9]{9}$/.test(phone)) {
            showError('signinError', 'Please enter a valid 10-digit phone number');
            return false;
        }
        
        if (!password || password.length < 7) {
            showError('signinError', 'Password must be at least 7 characters');
            return false;
        }
        
        return true;
    }

    function validateSignUp() {
        const fname = document.getElementById('fname')?.value;
        const lname = document.getElementById('lname')?.value;
        const phone = document.getElementById('phone')?.value;
        const password = document.getElementById('password')?.value;
        const confirmPassword = document.getElementById('confirm_password')?.value;
        const email = document.getElementById('email')?.value;
        const state = document.getElementById('state')?.value;
        const district = document.getElementById('district')?.value;
        
        clearError('signupError');
        
        if (!fname || !lname) {
            showError('signupError', 'Please enter your first and last name');
            return false;
        }
        
        if (!phone || !/^[6-9][0-9]{9}$/.test(phone)) {
            showError('signupError', 'Please enter a valid 10-digit phone number');
            return false;
        }
        
        if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            showError('signupError', 'Please enter a valid email address');
            return false;
        }
        
        if (!password || password.length < 7) {
            showError('signupError', 'Password must be at least 7 characters');
            return false;
        }
        
        if (password !== confirmPassword) {
            showError('signupError', 'Passwords do not match');
            return false;
        }
        
        if (!state || !district) {
            showError('signupError', 'Please select your state and district');
            return false;
        }
        
        return true;
    }

    // Placeholder Authentication Handlers (keep only if needed)
    function handleSignIn() {
        if (!validateSignIn()) return;
        
        const signinBtn = document.querySelector('#signin-form .btn');
        const originalText = signinBtn.textContent;
        signinBtn.textContent = 'Signing in...';
        signinBtn.disabled = true;
        
        setTimeout(() => {
            signinBtn.textContent = originalText;
            signinBtn.disabled = false;
            alert('Sign in successful! Redirecting to dashboard...');
        }, 1500);
    }

    function handleSignUp() {
        if (!validateSignUp()) return;
        
        const signupBtn = document.querySelector('#signup-form .btn');
        const originalText = signupBtn.textContent;
        signupBtn.textContent = 'Creating account...';
        signupBtn.disabled = true;
        
        setTimeout(() => {
            signupBtn.textContent = originalText;
            signupBtn.disabled = false;
            alert('Account created successfully! Please sign in.');
            
            // Switch to sign in tab
            const tabSignIn = document.getElementById('tab-signin');
            if (tabSignIn) tabSignIn.click();
            
            // Clear form
            document.getElementById('signup-form').reset();
        }, 1500);
    }
</script>
